name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/MailBridge/MailBridge.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - name: Package
        run: Compress-Archive -Path out/MailBridge.exe, accounts.example.json, LICENSE -DestinationPath MailBridge-${{ github.ref_name }}-win-x64.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} MailBridge-${{ github.ref_name }}-win-x64.zip --title ${{ github.ref_name }} --generate-notes
